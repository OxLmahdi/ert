<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuSearch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      background: #121212; /* প্রফেশনাল ডার্ক ব্যাকগ্রাউন্ড */
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      user-select: none;
    }

    /* Header - একদম ছিমছাম */
    .header {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      letter-spacing: 1px;
    }

    /* Upload Section - আপলোড করা এখন অনেক সহজ */
    .upload-section { margin-bottom: 15px; text-align: center; }

    .file-label {
      display: block;
      width: 100%;
      padding: 12px;
      background: #1e1e1e;
      border: 1px dashed #333;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      font-size: 12px;
      color: #888;
    }

    .file-label:hover {
      background: #252525;
      border-color: #555;
      color: #bbb;
    }

    input[type="file"] { display: none; }

    /* Search Box */
    .search-section { display: flex; flex-direction: column; gap: 10px; }

    .search-box input {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      outline: none;
      font-size: 12px;
      transition: border 0.2s;
    }

    .search-box input:focus { border-color: #555; background: #222; }

    /* Results Section */
    #resultsSection {
      max-height: 220px;
      overflow-y: auto;
      border-radius: 6px;
    }

    /* কাস্টম স্ক্রলবার */
    #resultsSection::-webkit-scrollbar { width: 4px; }
    #resultsSection::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .ds-result {
      padding: 10px;
      border-bottom: 1px solid #1f1f1f;
      cursor: default;
    }

    .ds-result:last-child { border-bottom: none; }

    .ds-q { font-size: 11px; color: #777; margin-bottom: 4px; line-height: 1.3; }
    .ds-a { font-size: 12px; color: #bbb; font-weight: bold; }

    /* Shortcut Hint */
    .hint {
      font-size: 10px;
      color: #444;
      text-align: center;
      margin-top: 15px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="header">DS WORKSPACE</div>

  <div class="upload-section" id="uploadSection">
    <label for="docxFile" class="file-label">📁 Click here to load module (DOCX)</label>
    <input type="file" id="docxFile" accept=".docx">
  </div>

  <div class="search-section" id="searchSection">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Query input..." autocomplete="off">
    </div>
    <div id="resultsSection"></div>
  </div>

  <div class="hint">Launch Panel: Ctrl + Shift + S</div>

  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>

</body>
</html>
